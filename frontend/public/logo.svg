    <path d="M-80,-100 Q-120,-100 -140,-70 Q-150,-40 -140,-10 Q-130,20 -100,40 Q-70,50 -40,40 L-40,-80 Q-60,-100 -80,-100 Z" 
          fill="#FFFFFF" opacity="0.95"/>
    
    <!-- Right Brain -->
    <path d="M80,-100 Q120,-100 140,-70 Q150,-40 140,-10 Q130,20 100,40 Q70,50 40,40 L40,-80 Q60,-100 80,-100 Z" 
          fill="#FFFFFF" opacity="0.95"/>
    
    <!-- Brain Details (Left) -->
    <path d="M-90,-60 Q-100,-50 -90,-40" stroke="#6366F1" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M-70,-70 Q-80,-60 -70,-50" stroke="#6366F1" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M-100,-20 Q-110,-10 -100,0" stroke="#6366F1" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- Brain Details (Right) -->
