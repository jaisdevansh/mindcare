  <rect width="32" height="32" rx="8" fill="#8B5CF6"/>
  
  <!-- Brain outline icon -->
  <g transform="translate(16, 16)" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left brain hemisphere -->
    <path d="M-6,-8 C-9,-8 -11,-6 -11,-3 C-11,-1 -10,1 -8,2 C-7,3 -5,3 -4,2 L-4,-6 C-4,-7 -5,-8 -6,-8 Z"/>
    
    <!-- Right brain hemisphere -->
    <path d="M6,-8 C9,-8 11,-6 11,-3 C11,-1 10,1 8,2 C7,3 5,3 4,2 L4,-6 C4,-7 5,-8 6,-8 Z"/>
    
    <!-- Brain stem/connection -->
    <path d="M-4,2 C-2,4 -1,5 0,5 C1,5 2,4 4,2"/>
    
    <!-- Brain folds/details -->
    <path d="M-7,-4 C-8,-3 -7,-2"/>
    <path d="M7,-4 C8,-3 7,-2"/>
    <path d="M-6,0 C-7,1 -6,2"/>
    <path d="M6,0 C7,1 6,2"/>
    
